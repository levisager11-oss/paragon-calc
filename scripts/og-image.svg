<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d1a"/>
      <stop offset="0.55" stop-color="#070913"/>
      <stop offset="1" stop-color="#04060e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <!-- top accent rule -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- ===== Header ===== -->
  <g transform="translate(72,74)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#accent)"/>
    <text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="#04060e" font-family="Fredoka, sans-serif">P</text>
    <text x="86" y="30" font-size="40" font-weight="700" fill="#f8fafc" font-family="Fredoka, sans-serif">BTD6 Paragon Calculator</text>
    <text x="88" y="62" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Bloons TD 6  &#183;  Update 39+ Certified  &#183;  All 13 Paragons</text>
  </g>

  <!-- ===== Left: Degree Gauge ===== -->
  <g transform="translate(310,360)">
    <circle r="168" fill="rgba(18,20,28,0.55)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <!-- track -->
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="22"/>
    <!-- full progress ring (degree 100) -->
    <circle r="140" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="879.6" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text x="0" y="-74" font-size="22" font-weight="600" text-anchor="middle" fill="#94a3b8" letter-spacing="3">DEGREE</text>
    <text x="0" y="44" font-size="132" font-weight="700" text-anchor="middle" fill="#f8fafc" font-family="Fredoka, sans-serif">100</text>
    <text x="0" y="90" font-size="17" font-weight="600" text-anchor="middle" fill="#22d3ee" letter-spacing="0.5">200,000 / 200,000 PWR</text>
  </g>

  <!-- ===== Right: Power Breakdown ===== -->
  <g transform="translate(560,212)">
    <text x="0" y="0" font-size="26" font-weight="700" fill="#f8fafc" font-family="Fredoka, sans-serif">Power Breakdown</text>

    <!-- Row template: label, value, bar -->
    <g transform="translate(0,40)">
      <text x="0" y="0" font-size="21" font-weight="600" fill="#e2e8f0">Pops &amp; Income</text>
      <text x="556" y="0" font-size="19" font-weight="600" text-anchor="end" fill="#94a3b8">90,000 pts</text>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="rgba(255,255,255,0.07)"/>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="url(#accent)"/>
    </g>
    <g transform="translate(0,108)">
      <text x="0" y="0" font-size="21" font-weight="600" fill="#e2e8f0">Sacrificed Upgrades</text>
      <text x="556" y="0" font-size="19" font-weight="600" text-anchor="end" fill="#94a3b8">10,000 pts</text>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="rgba(255,255,255,0.07)"/>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="url(#accent)"/>
    </g>
    <g transform="translate(0,176)">
      <text x="0" y="0" font-size="21" font-weight="600" fill="#e2e8f0">Cash Investment</text>
      <text x="556" y="0" font-size="19" font-weight="600" text-anchor="end" fill="#94a3b8">60,000 pts</text>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="rgba(255,255,255,0.07)"/>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="url(#accent)"/>
    </g>
    <g transform="translate(0,244)">
      <text x="0" y="0" font-size="21" font-weight="600" fill="#e2e8f0">Extra T5s</text>
      <text x="556" y="0" font-size="19" font-weight="600" text-anchor="end" fill="#94a3b8">50,000 pts</text>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="rgba(255,255,255,0.07)"/>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="url(#accent)"/>
    </g>
    <g transform="translate(0,312)">
      <text x="0" y="0" font-size="21" font-weight="600" fill="#fcd34d">Geraldo's Totems</text>
      <text x="556" y="0" font-size="19" font-weight="600" text-anchor="end" fill="#fcd34d">+2k each &#183; uncapped</text>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="rgba(245,158,11,0.14)"/>
      <rect x="0" y="14" width="556" height="16" rx="8" fill="url(#gold)"/>
    </g>
  </g>

  <!-- ===== Footer tagline ===== -->
  <g transform="translate(72,576)">
    <text x="0" y="0" font-size="22" font-weight="500" fill="#94a3b8">Find the exact degree (1&#8211;100) &#183; Solo &amp; Co-op &#183; Goal Planner &#183; No over-sacrificing</text>
  </g>
  <text x="1128" y="576" font-size="20" font-weight="700" text-anchor="end" fill="#22d3ee">paragon-calc.vercel.app</text>
</svg>
