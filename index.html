    <!-- Apply the stored theme before first paint so the page never flashes the
         wrong canvas colour while the bundle loads. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- Critical shell: paints the canvas and a layout skeleton on the first
         frame. React replaces #root wholesale once the bundle is ready. -->
    <style>
      :root { --boot-canvas: #0B0D12; --boot-surface: #12151C; --boot-sunken: #0E1116; --boot-border: rgba(255,255,255,.08); }
      [data-theme="light"] { --boot-canvas: #F7F8FA; --boot-surface: #FFFFFF; --boot-sunken: #F1F3F6; --boot-border: rgba(16,20,28,.10); }
      html, body { margin: 0; background: var(--boot-canvas); }
      .boot { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
      .boot-header { display: flex; align-items: center; justify-content: space-between; height: 64px; border-bottom: 1px solid var(--boot-border); }
      .boot-main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 40px 0; align-items: start; }
      .boot-block { background: var(--boot-surface); border: 1px solid var(--boot-border); border-radius: 16px; }
      .boot-bar { background: var(--boot-sunken); border-radius: 6px; }
      .boot-pulse { animation: boot-pulse 1.4s cubic-bezier(.2,0,0,1) infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
      @media (max-width: 1024px) { .boot-main { grid-template-columns: minmax(0, 1fr); } }
      @media (max-width: 720px) { .boot { padding: 0 16px; } }
      @media (prefers-reduced-motion: reduce) { .boot-pulse { animation: none; } }
    </style>
